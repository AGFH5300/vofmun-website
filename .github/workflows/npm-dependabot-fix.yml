name: npm Dependabot fix

on:
  push:
    branches:
      - dependabot-alerts-npm-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot-alerts-npm-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Show npm environment
        run: |
          node --version
          npm --version
      - name: Regenerate npm lockfile with overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply npm audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Install exactly from lockfile
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Audit all dependencies
        run: npm audit
      - name: Commit dependency fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/npm-dependabot-fix.yml
          if ! git diff --quiet; then
            git add package.json package-lock.json .github/workflows/npm-dependabot-fix.yml
            git commit -m "fix(deps): resolve npm dependabot alerts"
            git push origin HEAD:dependabot-alerts-npm-fix
          else
            git add .github/workflows/npm-dependabot-fix.yml
            git commit -m "chore: remove temporary npm dependency fixer"
            git push origin HEAD:dependabot-alerts-npm-fix
          fi
